name: Release

# 推 v* tag 时自动构建 Linux 双架构二进制并创建 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build linux binaries + bundles
        run: |
          set -e
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/ech-workers-linux-$arch .
            pkg=dist/pkg-$arch
            mkdir -p $pkg
            mv dist/ech-workers-linux-$arch $pkg/ech-workers
            cp chn_ip.txt chn_ip_v6.txt _worker.js README.md config.example.json $pkg/
            tar -czf dist/ech-workers-linux-$arch.tar.gz -C $pkg .
            rm -rf $pkg
          done
          ls -l dist/*.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/ech-workers-linux-amd64.tar.gz \
              dist/ech-workers-linux-arm64.tar.gz \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/ech-workers-linux-amd64.tar.gz \
              dist/ech-workers-linux-arm64.tar.gz \
              --title "${GITHUB_REF_NAME} · ECH Proxy Panel" \
              --generate-notes
          fi
