name: Release

# 推送 v* tag 时构建 Linux 双架构产物并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux binaries + bundles
        run: |
          set -e
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/ech-workers-linux-$arch .
            pkg=dist/pkg-$arch
            mkdir -p $pkg
            mv dist/ech-workers-linux-$arch $pkg/ech-workers
            cp chn_ip.txt chn_ip_v6.txt _worker.js README.md config.example.json $pkg/
            tar -czf dist/ech-workers-linux-$arch.tar.gz -C $pkg .
            rm -rf $pkg
          done
          ls -l dist/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/ech-workers-linux-amd64.tar.gz \
            dist/ech-workers-linux-arm64.tar.gz \
            --title "${GITHUB_REF_NAME} — ECH Proxy Panel" \
            --generate-notes
