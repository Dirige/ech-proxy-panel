version: '3.8'

services:
  ech-proxy:
    image: ghcr.io/dirige/ech-proxy-panel:latest
    container_name: ech-proxy
    restart: always
    ports:
      - "9090:9090"
      - "30000:30000"
    volumes:
      - /ikuai/docker/ECH/data:/data
    command: >
      -l 0.0.0.0:30000
      -f hhech.nb1tap.kdns.fr:443
      -token honghongfree
      -ip 172.64.229.240
      -web :9090
      -routing global
